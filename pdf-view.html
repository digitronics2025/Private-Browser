<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self'; connect-src 'none'; img-src data: blob:; font-src 'self' data: blob:; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>Protected PDF preview</title>
</head>
<body>
  <header>
    <h1>Protected PDF preview</h1>
    <p>Read and find text here. Saving and printing are blocked in this workspace.</p>
    <div class="toolbar">
      <button id="previous" type="button" disabled>Previous page</button>
      <button id="next" type="button" disabled>Next page</button>
      <label>Find text <input id="query" type="search" maxlength="120" disabled></label>
      <button id="find" type="button" disabled>Find</button>
    </div>
    <p id="status" role="status" aria-live="polite">Loading PDF…</p>
  </header>
  <main><canvas id="page" role="img" aria-label="PDF page"></canvas></main>
  <script type="module" src="/src/pdf-view.ts"></script>
</body>
</html>
