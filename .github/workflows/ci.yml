name: Verify and package

# Three levels:
#   Draft PR        -> nothing runs.
#   Ready PR        -> `verify` only (Ubuntu). No Windows runner, no installer, no artifacts.
#                      For a Windows-specific change, run this workflow manually on the PR
#                      branch (Actions -> Verify and package -> Run workflow) before merging.
#   Push to main    -> `verify`, then — only when the application changed — the Windows
#                      transport/Electron journeys + installer. Public publication of the
#                      Agent Mode build requires the owner's release approval variable.
#                      Download-service inputs are reported separately from installer publication.
#   workflow_dispatch -> verify + Windows journeys + installer for the chosen ref (never publishes).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel superseded runs. Pushes to main never do: a cancelled
# run could stop between the R2 upload and the D1 registration, and a job-level
# group cannot shield a job from its whole run being cancelled (F-21, F-41).
concurrency:
  group: private-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Push to main only. Decides whether the application and/or the download service changed,
  # comparing with what production actually runs, not with the previous push: if an app
  # change's run never published (cancelled, failed), a later docs-only push must still
  # release it. The explicit instruction-only guard below takes precedence.
  # Fails SAFE (unknown -> changed).
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.app.outputs.app }}
      cloudflare: ${{ steps.cloudflare.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Detect whether this push changes the application
        id: app
        shell: bash
        env:
          PRIVATE_BROWSER_DOWNLOAD_URL: ${{ vars.PRIVATE_BROWSER_DOWNLOAD_URL }}
          PRIVATE_BROWSER_RELEASE_VERIFY_DEVICE: ${{ secrets.PRIVATE_BROWSER_RELEASE_VERIFY_DEVICE }}
        run: |
          before=""
          if [[ -n "$PRIVATE_BROWSER_DOWNLOAD_URL" ]]; then
            active="$(node cloudflare/scripts/read-active-release.mjs | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const v=JSON.parse(s).commitSha;if(/^[0-9a-f]{40}$/.test(v))process.stdout.write(v)}catch{}})' || true)"
            if [[ -n "$active" ]] && git cat-file -e "${active}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$active" "${{ github.sha }}"; then
              before="$active"
              echo "Comparing with the active release commit $active"
            fi
          fi

          # Guide and release-operation updates must never publish an app.
          # A push with any other file still uses the existing active-release comparison.
          BEFORE_SHA="${{ github.event.before }}"
          if [[ "${BEFORE_SHA:-}" =~ ^[0-9a-f]{40}$ && ! "$BEFORE_SHA" =~ ^0+$ ]] &&
             push_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" --)" &&
             [[ -n "$push_files" ]] && ! grep -qvE '^(AGENTS\.md|CLAUDE\.md|\.github/copilot-instructions\.md|\.continue/rules/shared-report\.md|\.github/workflows/(ci|release-status)\.yml|\.github/scripts/release-status(\.test)?\.mjs|docs/reference/release-status\.md)$' <<< "$push_files"; then
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "Instruction and release workflow changes only. App publication skipped."
            exit 0
          fi

          if [[ -z "$before" ]]; then
            before="$BEFORE_SHA"
            if [[ -z "$before" || "$before" =~ ^0+$ ]] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              before="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
          fi
          changed="$(git diff --name-only "$before" "${{ github.sha }}" || true)"
          echo "Changed paths:"; echo "${changed:-<none>}"
          if [[ -z "$changed" ]] || echo "$changed" | grep -qvE '^(docs/.*|[^/]*\.md)$'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only push: no installer is built and no release is published."
          fi
      # Same inputs the standalone deploy workflow used to watch on push.
      - name: Detect download-service changes
        id: cloudflare
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- cloudflare package.json package-lock.json .github/workflows/deploy-cloudflare.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare runtime and dependency inputs are unchanged; no service deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize affected release paths
        shell: bash
        env:
          APP_CHANGED: ${{ steps.app.outputs.app }}
          WORKER_CHANGED: ${{ steps.cloudflare.outputs.changed }}
        run: |
          {
            echo '### Release path classification'
            if [[ "$APP_CHANGED" == "true" ]]; then
              echo '- Windows app inputs changed. Windows verification and publication gates apply.'
            else
              echo '- Instructions, documentation or release tooling only. App publication skipped.'
            fi
            if [[ "$WORKER_CHANGED" == "true" ]]; then
              echo '- Download Worker inputs changed. The Worker deployment path is tracked separately.'
            else
              echo '- Download Worker inputs unchanged.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Verify bridge protocol (Windows transport is skipped here)
        run: npm run bridge:test
      # Installed once (it used to be installed twice), right before the gate that needs it.
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Keep Agent Mode desktop and mobile previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-browser-agent-previews
          path: test-results/agents-*/agent*.png
          retention-days: 5
          if-no-files-found: error
      # Browser test failures on the runner are not always reproducible locally;
      # keep the screenshots and traces (preview mock data only) to diagnose them.
      - name: Keep browser test evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-evidence
          path: |
            test-results/
            blob-report/
          retention-days: 5
          if-no-files-found: ignore

  # The real Windows named-pipe transport, Electron isolation and installer: main pushes that
  # change the application, and manual runs. Never for an ordinary pull request.
  windows-installer:
    needs: [verify, changes]
    if: >-
      !cancelled() && needs.verify.result == 'success' && (
        (github.event_name == 'push' && needs.changes.outputs.app == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: windows-latest
    timeout-minutes: 25
    # No job-level secrets: `npm ci` must not run with credentials in its
    # environment, or any dependency's install script can read them.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Exercise the real Windows named-pipe transport
        run: npm run bridge:test
      - name: Exercise real Electron Account Space isolation and Agent MCP
        shell: pwsh
        run: |
          npm run test:electron | Tee-Object -FilePath agent-electron-smoke.txt
          exit $LASTEXITCODE
      - name: Keep Electron Agent MCP smoke transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: electron-agent-smoke
          path: agent-electron-smoke.txt
          retention-days: 5
          if-no-files-found: warn
      - name: Verify Electron MyVault boundary
        # The previous Electron suite built these inputs on this same runner.
        run: npm run test:e2e:only
      - name: Select the next release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          PRIVATE_BROWSER_DOWNLOAD_URL: ${{ vars.PRIVATE_BROWSER_DOWNLOAD_URL }}
          PRIVATE_BROWSER_RELEASE_VERIFY_DEVICE: ${{ secrets.PRIVATE_BROWSER_RELEASE_VERIFY_DEVICE }}
        run: |
          $version = (node cloudflare/scripts/prepare-release-version.mjs).Trim()
          "Selected release version $version"
      - name: Record packaged version
        id: packaged-version
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build hardened Windows installer
        env:
          # Optional repository secrets. electron-builder signs when both are
          # configured; an unset pair keeps local and fork builds working.
          CSC_LINK: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD }}
        run: npm run dist
      - name: Exercise the installed Windows release candidate
        shell: pwsh
        env:
          PRIVATE_BROWSER_PACKAGED_VERSION: ${{ steps.packaged-version.outputs.version }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: packaged-windows-smoke.json
        run: |
          $installDirectory = Join-Path $env:RUNNER_TEMP ('private-browser-smoke-' + [guid]::NewGuid().ToString('N'))
          $installerName = "Private-Browser-$env:PRIVATE_BROWSER_PACKAGED_VERSION-Setup.exe"
          $installer = Get-Item -LiteralPath (Join-Path release $installerName) -ErrorAction Stop
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDirectory") -WindowStyle Hidden -PassThru -Wait
          if ($installed.ExitCode -ne 0) { throw "The Windows candidate installer exited with $($installed.ExitCode)" }
          $env:PRIVATE_BROWSER_PACKAGED_EXE = Join-Path $installDirectory 'Private Browser.exe'
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "### Installed Windows smoke · $env:PRIVATE_BROWSER_PACKAGED_VERSION" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "Installer SHA-256: $checksum" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          npx playwright test --config playwright.packaged.config.ts | Tee-Object -FilePath packaged-windows-smoke.txt
          $testExit = $LASTEXITCODE
          if (Test-Path -LiteralPath packaged-windows-smoke.json) {
            $report = Get-Content -LiteralPath packaged-windows-smoke.json -Raw | ConvertFrom-Json
            $scenario = $report.suites[0].specs[0].tests[0].results[0]
            foreach ($step in $scenario.steps) {
              $status = if ($step.error -or $step.duration -lt 0) { 'Failed' } else { 'Passed' }
              "- $status · $($step.title)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            }
          }
          if ($testExit -ne 0) { exit $testExit }
      - name: Keep installed Windows smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-windows-smoke
          path: |
            packaged-windows-smoke.txt
            packaged-windows-smoke.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Smoke install the private VSIX in an isolated profile
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'private-browser-vscode-profile'
          $extensions = Join-Path $env:RUNNER_TEMP 'private-browser-vscode-extensions'
          $vsix = Get-ChildItem release\private-browser-bridge-*.vsix | Select-Object -First 1
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Microsoft VS Code\bin\code.cmd'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Microsoft VS Code\bin\code.cmd')
          )
          $code = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $code) {
            choco install vscode --no-progress -y
            $code = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $code) { throw 'VS Code CLI is unavailable after installation' }
          & $code --install-extension $vsix.FullName --force --user-data-dir $profile --extensions-dir $extensions
          $installed = & $code --list-extensions --user-data-dir $profile --extensions-dir $extensions
          if ($installed -notcontains 'digitronics.private-browser-bridge') { throw 'Private Browser Bridge VSIX smoke install failed' }
      - name: Generate release metadata
        shell: pwsh
        env:
          CERTIFICATE_CONFIGURED: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE != '' }}
          PASSWORD_CONFIGURED: ${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD != '' }}
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.WINDOWS_CODE_SIGNING_CERTIFICATE_SHA256 }}
        run: |
          $installer = Get-ChildItem release\*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content release\SHA256SUMS.txt
          if ($env:CERTIFICATE_CONFIGURED -ne $env:PASSWORD_CONFIGURED) { throw 'Windows code signing is only partly configured.' }
          $signing = $env:CERTIFICATE_CONFIGURED -eq 'true'
          ./cloudflare/scripts/record-windows-publisher.ps1 -Installer $installer.FullName -Sha256 $hash -Destination release/PUBLISHER.json -SigningConfigured:$signing -ExpectedCertificateSha256 $env:EXPECTED_CERTIFICATE_SHA256
          "${{ steps.packaged-version.outputs.version }}" | Set-Content release\VERSION.txt -NoNewline
          npm sbom --sbom-format cyclonedx | Out-File -Encoding utf8 release\SBOM.cdx.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-browser-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/PUBLISHER.json
            release/VERSION.txt
            release/SBOM.cdx.json
          if-no-files-found: error
          # Hand-off to the publish job; the published copy lives in R2.
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-browser-bridge-vsix
          path: release/private-browser-bridge-*.vsix
          if-no-files-found: error
          retention-days: 7

  publish-cloudflare-release:
    # After the installer. The download service Worker itself is deployed by Cloudflare Workers Builds
    # (not by Actions); push download-service changes before app changes that depend on them.
    needs: [changes, windows-installer]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.app == 'true'
      && needs.windows-installer.result == 'success'
      && vars.PRIVATE_BROWSER_AGENT_MODE_RELEASE_APPROVED == github.sha
    # One publish at a time across runs, never cancelled. Main-branch runs are
    # not cancelled at the workflow level either (see the top of this file).
    concurrency:
      group: private-browser-publish-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets are attached per step below, never to the job, so `npm ci` runs
    # without them in scope.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      # Install scripts are off for every dependency: this job later hands the
      # Cloudflare token to wrangler and the admin key to the publish scripts
      # (F-55). Only wrangler's own engine packages run theirs — the lock file,
      # written on Windows, lists just their Windows binaries, and their install
      # step fetches the Linux one wrangler cannot start without.
      - run: npm ci --ignore-scripts
      - run: npm rebuild workerd esbuild
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: private-browser-windows
          path: release
      - name: Restore the packaged release version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < release/VERSION.txt)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid packaged release version: $version" >&2
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
      - name: Detect publishing configuration
        id: configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRIVATE_BROWSER_DOWNLOAD_URL: ${{ vars.PRIVATE_BROWSER_DOWNLOAD_URL }}
          PRIVATE_BROWSER_ADMIN_API_KEY: ${{ secrets.PRIVATE_BROWSER_ADMIN_API_KEY }}
          PRIVATE_BROWSER_DOWNLOAD_TOKEN: ${{ secrets.PRIVATE_BROWSER_DOWNLOAD_TOKEN }}
          PRIVATE_BROWSER_RELEASE_VERIFY_DEVICE: ${{ secrets.PRIVATE_BROWSER_RELEASE_VERIFY_DEVICE }}
        run: |
          if [[ "${{ needs.changes.outputs.app }}" == "true" && -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$PRIVATE_BROWSER_DOWNLOAD_URL" && -n "$PRIVATE_BROWSER_ADMIN_API_KEY" && ( ${#PRIVATE_BROWSER_DOWNLOAD_TOKEN} -ge 32 || -n "$PRIVATE_BROWSER_RELEASE_VERIFY_DEVICE" ) ]]; then
            node cloudflare/scripts/read-active-release.mjs >/dev/null
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.changes.outputs.app }}" != "true" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare release publishing is not configured; the verified GitHub artifact remains available."
          fi
      - name: Record the release being replaced
        if: steps.configured.outputs.ready == 'true'
        id: previous
        shell: bash
        env:
          PRIVATE_BROWSER_DOWNLOAD_URL: ${{ vars.PRIVATE_BROWSER_DOWNLOAD_URL }}
          PRIVATE_BROWSER_RELEASE_VERIFY_DEVICE: ${{ secrets.PRIVATE_BROWSER_RELEASE_VERIFY_DEVICE }}
        run: |
          node cloudflare/scripts/read-active-release.mjs |
          node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{
            const v=JSON.parse(s);
            if(/^\d+\.\d+\.\d+$/.test(v.version)&&Number.isSafeInteger(v.buildNumber))console.log(`id=stable-${v.version}-${v.buildNumber}`);
            if(/^[a-f0-9]{40}$/.test(v.commitSha))console.log(`revision=${v.commitSha}`);
          }catch{}})' >> "$GITHUB_OUTPUT" || true
      - name: Upload installer to private R2 bucket
        if: steps.configured.outputs.ready == 'true'
        id: upload
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          installer="$(find release -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$installer"
          node cloudflare/scripts/verify-release-candidate.mjs "$installer"
          version="$(node -p "require('./package.json').version")"
          object_key="releases/${version}/${GITHUB_RUN_NUMBER}/$(basename "$installer")"
          npx wrangler r2 object put "private-browser-releases/${object_key}" --file "$installer" --content-type application/vnd.microsoft.portable-executable --remote
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "object_key=$object_key" >> "$GITHUB_OUTPUT"
      - name: Verify candidate bytes from private R2
        if: steps.configured.outputs.ready == 'true'
        id: staged
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INSTALLER_PATH: ${{ steps.upload.outputs.installer }}
          OBJECT_KEY: ${{ steps.upload.outputs.object_key }}
        run: |
          candidate_dir="$(mktemp -d "$RUNNER_TEMP/private-browser-candidate.XXXXXXXX")"
          candidate_file="$candidate_dir/candidate.exe"
          trap 'rm -f -- "$candidate_file" "$candidate_dir/publisher.json"; rmdir -- "$candidate_dir"' EXIT
          npx wrangler r2 object get "private-browser-releases/$OBJECT_KEY" --file "$candidate_file" --remote
          receipt="$(node cloudflare/scripts/verify-release-candidate.mjs "$INSTALLER_PATH" "$candidate_file")"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { parsePublisherReceipt } from "./cloudflare/src/publisher-receipt.mjs"; const receipt = JSON.parse(process.argv[1]); const publisher = JSON.parse(readFileSync("release/PUBLISHER.json", "utf8").replace(/^\uFEFF/, "")); if (!parsePublisherReceipt(publisher, receipt.sha256)) throw new Error("Windows publisher evidence does not match the installer");' "$receipt"
          npx wrangler r2 object put "private-browser-releases/${OBJECT_KEY}.publisher.json" --file release/PUBLISHER.json --content-type application/json --remote
          npx wrangler r2 object get "private-browser-releases/${OBJECT_KEY}.publisher.json" --file "$candidate_dir/publisher.json" --remote
          cmp --silent release/PUBLISHER.json "$candidate_dir/publisher.json"
          printf '### Private installer candidate verified\n\n```json\n%s\n```\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - name: Publish D1 release metadata
        if: steps.configured.outputs.ready == 'true' && steps.staged.outputs.verified == 'true'
        env:
          PRIVATE_BROWSER_DOWNLOAD_URL: ${{ vars.PRIVATE_BROWSER_DOWNLOAD_URL }}
          PRIVATE_BROWSER_ADMIN_API_KEY: ${{ secrets.PRIVATE_BROWSER_ADMIN_API_KEY }}
          PREVIOUS_RELEASE_REVISION: ${{ steps.previous.outputs.revision }}
          INSTALLER_PATH: ${{ steps.upload.outputs.installer }}
          OBJECT_KEY: ${{ steps.upload.outputs.object_key }}
        run: node cloudflare/scripts/publish-release.mjs "$INSTALLER_PATH" "$OBJECT_KEY"
      - name: Verify authenticated download end to end
        if: steps.configured.outputs.ready == 'true' && steps.staged.outputs.verified == 'true'
        env:
          PRIVATE_BROWSER_DOWNLOAD_URL: ${{ vars.PRIVATE_BROWSER_DOWNLOAD_URL }}
          PRIVATE_BROWSER_DOWNLOAD_TOKEN: ${{ secrets.PRIVATE_BROWSER_DOWNLOAD_TOKEN }}
          PRIVATE_BROWSER_RELEASE_VERIFY_DEVICE: ${{ secrets.PRIVATE_BROWSER_RELEASE_VERIFY_DEVICE }}
          PRIVATE_BROWSER_ADMIN_API_KEY: ${{ secrets.PRIVATE_BROWSER_ADMIN_API_KEY }}
          PREVIOUS_RELEASE_ID: ${{ steps.previous.outputs.id }}
          INSTALLER_PATH: ${{ steps.upload.outputs.installer }}
        shell: bash
        run: |
          # The new release is already active here; if users would not get
          # exactly the installer that was built, put the previous one back (F-50).
          if receipt="$(node cloudflare/scripts/verify-live-release.mjs "$INSTALLER_PATH")"; then
            printf '%s\n' "$receipt"
            printf '### Stable installer verified\n\n```json\n%s\n```\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -n "$PREVIOUS_RELEASE_ID" ]]; then
            echo "::error::Live verification failed; re-activating $PREVIOUS_RELEASE_ID"
            node cloudflare/scripts/activate-release.mjs "$PREVIOUS_RELEASE_ID"
            printf '### Live verification failed\n\nRestored %s.\n' "$PREVIOUS_RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Live verification failed and there is no earlier release to restore"
          fi
          exit 1
