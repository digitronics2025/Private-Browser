name: Verify and package

# Three levels:
#   Draft PR        -> nothing runs.
#   Ready PR        -> `verify` only (Ubuntu). No Windows runner, no installer, no artifacts.
#                      For a Windows-specific change, run this workflow manually on the PR
#                      branch (Actions -> Verify and package -> Run workflow) before merging.
#   Push to main    -> `verify`, then — only when the application changed — the Windows
#                      transport/Electron journeys + installer. Public publication of the
#                      Agent Mode build requires the owner's release approval variable.
#                      Download-service inputs are reported separately from installer publication.
#   workflow_dispatch -> verify + Windows journeys + installer for the chosen ref (never publishes).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel superseded runs. Pushes to main never do: a cancelled
# run could stop between the R2 upload and the D1 registration, and a job-level
# group cannot shield a job from its whole run being cancelled (F-21, F-41).
concurrency:
  group: private-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Push to main only. Decides whether the application and/or the download service changed,
  # comparing with what production actually runs, not with the previous push: if an app
  # change's run never published (cancelled, failed), a later docs-only push must still
  # release it. The explicit instruction-only guard below takes precedence.
  # Fails SAFE (unknown -> changed).
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.app.outputs.app }}
      cloudflare: ${{ steps.cloudflare.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Detect whether this push changes the application
        id: app
        shell: bash
        env:
          PRIVATE_BROWSER_DOWNLOAD_URL: ${{ vars.PRIVATE_BROWSER_DOWNLOAD_URL }}
        run: |
          before=""
          if [[ -n "$PRIVATE_BROWSER_DOWNLOAD_URL" ]]; then
            active="$(node cloudflare/scripts/read-active-release.mjs | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const v=JSON.parse(s).commitSha;if(/^[0-9a-f]{40}$/.test(v))process.stdout.write(v)}catch{}})' || true)"
            if [[ -n "$active" ]] && git cat-file -e "${active}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$active" "${{ github.sha }}"; then
              before="$active"
              echo "Comparing with the active release commit $active"
            fi
          fi

          # Guide and release-operation updates must never publish an app.
          # A push with any other file still uses the existing active-release comparison.
          BEFORE_SHA="${{ github.event.before }}"
          if [[ "${BEFORE_SHA:-}" =~ ^[0-9a-f]{40}$ && ! "$BEFORE_SHA" =~ ^0+$ ]] &&
             push_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" --)" &&
             [[ -n "$push_files" ]] && ! grep -qvE '^(AGENTS\.md|CLAUDE\.md|\.github/copilot-instructions\.md|\.continue/rules/shared-report\.md|\.github/workflows/(ci|release-status)\.yml|\.github/scripts/release-status(\.test)?\.mjs|docs/reference/release-status\.md)$' <<< "$push_files"; then
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "Instruction and release workflow changes only. App publication skipped."
            exit 0
          fi

          if [[ -z "$before" ]]; then
            before="$BEFORE_SHA"
            if [[ -z "$before" || "$before" =~ ^0+$ ]] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              before="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
          fi
          changed="$(git diff --name-only "$before" "${{ github.sha }}" || true)"
          echo "Changed paths:"; echo "${changed:-<none>}"
          if [[ -z "$changed" ]] || echo "$changed" | grep -qvE '^(docs/.*|[^/]*\.md)$'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only push: no installer is built and no release is published."
          fi
      # Same inputs the standalone deploy workflow used to watch on push.
      - name: Detect download-service changes
        id: cloudflare
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- cloudflare package.json package-lock.json .github/workflows/deploy-cloudflare.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare runtime and dependency inputs are unchanged; no service deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize affected release paths
        shell: bash
        env:
          APP_CHANGED: ${{ steps.app.outputs.app }}
          WORKER_CHANGED: ${{ steps.cloudflare.outputs.changed }}
        run: |
          {
            echo '### Release path classification'
            if [[ "$APP_CHANGED" == "true" ]]; then
              echo '- Windows app inputs changed. Windows verification and publication gates apply.'
            else
              echo '- Instructions, documentation or release tooling only. App publication skipped.'
            fi
            if [[ "$WORKER_CHANGED" == "true" ]]; then
              echo '- Download Worker inputs changed. The Worker deployment path is tracked separately.'
            else
              echo '- Download Worker inputs unchanged.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Verify bridge protocol (Windows transport is skipped here)
        run: npm run bridge:test
      # Installed once (it used to be installed twice), right before the gate that needs it.
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Keep Agent Mode desktop and mobile previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-browser-agent-previews
          path: test-results/agents-*/agent*.png
          retention-days: 5
          if-no-files-found: error
      # Browser test failures on the runner are not always reproducible locally;
      # keep the screenshots and traces (preview mock data only) to diagnose them.
      - name: Keep browser test evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-evidence
          path: |
            test-results/
            blob-report/
          retention-days: 5
          if-no-files-found: ignore

  # The real Windows named-pipe transport, Electron isolation and installer: main pushes that
  # change the application, and manual runs. Never for an ordinary pull request.
  windows-installer:
    needs: [verify, changes]
    if: >-
      !cancelled() && needs.verify.result == 'success' && (
        (github.event_name == 'push' && needs.changes.outputs.app == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: windows-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRIVATE_BROWSER_AGENT_MODE_RELEASE_APPROVED == github.sha && 'production-release' || 'windows-verification' }}
    env:
      PRIVATE_BROWSER_STABLE_BUILD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRIVATE_BROWSER_AGENT_MODE_RELEASE_APPROVED == github.sha }}

    # No job-level secrets: `npm ci` must not run with credentials in its
    # environment, or any dependency's install script can read them.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Exercise the real Windows named-pipe transport
        run: npm run bridge:test
      - name: Exercise real Electron Account Space isolation and Agent MCP
        shell: pwsh
        run: |
          npm run test:electron | Tee-Object -FilePath agent-electron-smoke.txt
          exit $LASTEXITCODE
      - name: Keep Electron Agent MCP smoke transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: electron-agent-smoke
          path: agent-electron-smoke.txt
          retention-days: 5
          if-no-files-found: warn
      - name: Verify Electron MyVault boundary
        # The previous Electron suite built these inputs on this same runner.
        run: npm run test:e2e:only
      - name: Select the next release version
        if: env.PRIVATE_BROWSER_STABLE_BUILD == 'true'
        shell: pwsh
        env:
          PRIVATE_BROWSER_DOWNLOAD_URL: ${{ vars.PRIVATE_BROWSER_DOWNLOAD_URL }}
          PRIVATE_BROWSER_RELEASE_VERIFY_DEVICE: ${{ secrets.PRODUCTION_RELEASE_VERIFY_DEVICE }}
        run: |
          $version = (node cloudflare/scripts/prepare-release-version.mjs).Trim()
          "Selected release version $version"
      - name: Record packaged version
        id: packaged-version
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build hardened Windows installer
        shell: pwsh
        env:
          CSC_LINK: ${{ env.PRIVATE_BROWSER_STABLE_BUILD == 'true' && secrets.PRODUCTION_WINDOWS_SIGNING_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ env.PRIVATE_BROWSER_STABLE_BUILD == 'true' && secrets.PRODUCTION_WINDOWS_SIGNING_PASSWORD || '' }}
          PRIVATE_BROWSER_WINDOWS_PUBLISHERS: ${{ env.PRIVATE_BROWSER_STABLE_BUILD == 'true' && vars.WINDOWS_CODE_SIGNING_CERTIFICATE_SHA256 || '' }}
        run: |
          if ($env:PRIVATE_BROWSER_STABLE_BUILD -eq 'true' -and (!$env:CSC_LINK -or !$env:CSC_KEY_PASSWORD -or !$env:PRIVATE_BROWSER_WINDOWS_PUBLISHERS)) {
            throw 'Production signing and the approved publisher fingerprint are required.'
          }
          npm run dist
          exit $LASTEXITCODE
      - name: Verify signed app and installer
        if: env.PRIVATE_BROWSER_STABLE_BUILD == 'true'
        shell: pwsh
        env:
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.WINDOWS_CODE_SIGNING_CERTIFICATE_SHA256 }}
        run: |
          $installer = Get-Item -LiteralPath "release/Private-Browser-${{ steps.packaged-version.outputs.version }}-Setup.exe"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content release/SHA256SUMS.txt
          ./cloudflare/scripts/record-windows-publisher.ps1 -Installer $installer.FullName -Sha256 $hash -Destination release/PUBLISHER.json -SigningConfigured -ExpectedCertificateSha256 $env:EXPECTED_CERTIFICATE_SHA256
          $app = Get-Item -LiteralPath 'release/win-unpacked/Private Browser.exe'
          $appHash = (Get-FileHash -LiteralPath $app.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          ./cloudflare/scripts/record-windows-publisher.ps1 -Installer $app.FullName -Sha256 $appHash -Destination release/APP-PUBLISHER.json -SigningConfigured -ExpectedCertificateSha256 $env:EXPECTED_CERTIFICATE_SHA256
          npm sbom --sbom-format cyclonedx | Out-File -Encoding utf8 release/SBOM.cdx.json
          exit $LASTEXITCODE
      - name: Exercise the installed Windows release candidate
        shell: pwsh
        env:
          PRIVATE_BROWSER_PACKAGED_VERSION: ${{ steps.packaged-version.outputs.version }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: packaged-windows-smoke.json
        run: |
          $installDirectory = Join-Path $env:RUNNER_TEMP ('private-browser-smoke-' + [guid]::NewGuid().ToString('N'))
          $installerName = "Private-Browser-$env:PRIVATE_BROWSER_PACKAGED_VERSION-Setup.exe"
          $installer = Get-Item -LiteralPath (Join-Path release $installerName) -ErrorAction Stop
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDirectory") -WindowStyle Hidden -PassThru -Wait
          if ($installed.ExitCode -ne 0) { throw "The Windows candidate installer exited with $($installed.ExitCode)" }
          $env:PRIVATE_BROWSER_PACKAGED_EXE = Join-Path $installDirectory 'Private Browser.exe'
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "### Installed Windows smoke · $env:PRIVATE_BROWSER_PACKAGED_VERSION" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "Installer SHA-256: $checksum" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          npx playwright test --config playwright.packaged.config.ts | Tee-Object -FilePath packaged-windows-smoke.txt
          $testExit = $LASTEXITCODE
          if (Test-Path -LiteralPath packaged-windows-smoke.json) {
            $report = Get-Content -LiteralPath packaged-windows-smoke.json -Raw | ConvertFrom-Json
            $scenario = $report.suites[0].specs[0].tests[0].results[0]
            foreach ($step in $scenario.steps) {
              $status = if ($step.error -or $step.duration -lt 0) { 'Failed' } else { 'Passed' }
              "- $status · $($step.title)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            }
          }
          if ($testExit -ne 0) { exit $testExit }
      - name: Keep installed Windows smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-windows-smoke
          path: |
            packaged-windows-smoke.txt
            packaged-windows-smoke.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Smoke install the private VSIX in an isolated profile
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'private-browser-vscode-profile'
          $extensions = Join-Path $env:RUNNER_TEMP 'private-browser-vscode-extensions'
          $vsix = Get-ChildItem release\private-browser-bridge-*.vsix | Select-Object -First 1
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Microsoft VS Code\bin\code.cmd'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Microsoft VS Code\bin\code.cmd')
          )
          $code = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $code) {
            choco install vscode --no-progress -y
            $code = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $code) { throw 'VS Code CLI is unavailable after installation' }
          & $code --install-extension $vsix.FullName --force --user-data-dir $profile --extensions-dir $extensions
          $installed = & $code --list-extensions --user-data-dir $profile --extensions-dir $extensions
          if ($installed -notcontains 'digitronics.private-browser-bridge') { throw 'Private Browser Bridge VSIX smoke install failed' }
      - name: Publish installer from private R2
        if: env.PRIVATE_BROWSER_STABLE_BUILD == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_RELEASE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_RELEASE_ACCOUNT_ID }}
          PRIVATE_BROWSER_DOWNLOAD_URL: ${{ vars.PRIVATE_BROWSER_DOWNLOAD_URL }}
          PRIVATE_BROWSER_RELEASE_VERIFY_DEVICE: ${{ secrets.PRODUCTION_RELEASE_VERIFY_DEVICE }}
          PRIVATE_BROWSER_RELEASE_AUTOMATION_KEY: ${{ secrets.PRODUCTION_RELEASE_AUTOMATION_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PRIVATE_BROWSER_RELEASE_AUTOMATION_KEY"
          test -n "$PRIVATE_BROWSER_RELEASE_VERIFY_DEVICE"
          previous="$(node cloudflare/scripts/read-active-release.mjs)"
          if [[ -z "$previous" ]]; then previous='{}'; fi
          export PREVIOUS_RELEASE_REVISION="$(node -e 'const v=JSON.parse(process.argv[1]);if(/^[a-f0-9]{40}$/.test(v.commitSha))process.stdout.write(v.commitSha)' "$previous")"
          previous_id="$(node -e 'const v=JSON.parse(process.argv[1]);if(/^\d+\.\d+\.\d+$/.test(v.version)&&Number.isSafeInteger(v.buildNumber))process.stdout.write(`stable-${v.version}-${v.buildNumber}`)' "$previous")"
          installer="release/Private-Browser-${{ steps.packaged-version.outputs.version }}-Setup.exe"
          candidate="$(node cloudflare/scripts/verify-release-candidate.mjs "$installer")"
          digest="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).sha256)' "$candidate")"
          object_key="releases/$digest/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$(basename "$installer")"
          candidate_dir="$(mktemp -d)"
          trap 'rm -f -- "$candidate_dir/candidate.exe" "$candidate_dir/publisher.json"; rmdir -- "$candidate_dir"' EXIT
          npx --no-install wrangler r2 object put "private-browser-releases/$object_key" --file "$installer" --content-type application/vnd.microsoft.portable-executable --remote
          npx --no-install wrangler r2 object get "private-browser-releases/$object_key" --file "$candidate_dir/candidate.exe" --remote
          receipt="$(node cloudflare/scripts/verify-release-candidate.mjs "$installer" "$candidate_dir/candidate.exe")"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { parsePublisherReceipt } from "./cloudflare/src/publisher-receipt.mjs"; const receipt = JSON.parse(process.argv[1]); const publisher = JSON.parse(readFileSync("release/PUBLISHER.json", "utf8").replace(/^\uFEFF/, "")); if (!parsePublisherReceipt(publisher, receipt.sha256)?.signerSha256) throw new Error("Approved Windows publisher evidence is required");' "$receipt"
          npx --no-install wrangler r2 object put "private-browser-releases/$object_key.publisher.json" --file release/PUBLISHER.json --content-type application/json --remote
          npx --no-install wrangler r2 object get "private-browser-releases/$object_key.publisher.json" --file "$candidate_dir/publisher.json" --remote
          cmp --silent release/PUBLISHER.json "$candidate_dir/publisher.json"
          publication="$(node cloudflare/scripts/publish-release.mjs "$installer" "$object_key")"
          published_id="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).id)' "$publication")"
          if delivered="$(node cloudflare/scripts/verify-live-release.mjs "$installer")"; then
            printf '### Stable installer verified\n\n```json\n%s\n```\n' "$delivered" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Live verification failed. Attempting to restore the prior eligible release."
            if [[ -n "$previous_id" ]] && node cloudflare/scripts/activate-release.mjs "$previous_id" "$published_id"; then
              echo "Restored $previous_id" >> "$GITHUB_STEP_SUMMARY"
            else
              node cloudflare/scripts/suspend-release.mjs "$published_id"
            fi
            exit 1
          fi
      - name: Keep signed release evidence
        if: env.PRIVATE_BROWSER_STABLE_BUILD == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-browser-release-evidence
          path: |
            release/SHA256SUMS.txt
            release/PUBLISHER.json
            release/APP-PUBLISHER.json
            release/SBOM.cdx.json
          if-no-files-found: error
          retention-days: 14
